<svg width="860" height="200" viewBox="0 0 860 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050914"/>
      <stop offset="100%" stop-color="#0a1020"/>
    </linearGradient>
  </defs>
  <!-- Terminal window -->
  <rect width="860" height="200" rx="18" fill="url(#bg)" stroke="#00d2ff" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Titlebar -->
  <rect x="0" y="0" width="860" height="38" rx="18" fill="#0b1326"/>
  <rect x="0" y="20" width="860" height="18" fill="#0b1326"/>
  <rect x="0" y="36" width="860" height="2" fill="#1e2d4a"/>

  <!-- Traffic lights -->
  <circle cx="22" cy="19" r="6.5" fill="#f05252" opacity="0.85"/>
  <circle cx="44" cy="19" r="6.5" fill="#f59e0b" opacity="0.85"/>
  <circle cx="66" cy="19" r="6.5" fill="#10b981" opacity="0.85"/>

  <!-- Title -->
  <text x="88" y="24" fill="#00d2ff" font-family="Consolas,monospace" font-size="12">⬛</text>
  <text x="104" y="24" fill="#94a3b8" font-family="Consolas,monospace" font-size="12">anwar@dev-terminal:~</text>

  <!-- Clear log btn -->
  <rect x="782" y="11" width="68" height="18" rx="5" fill="#152136" stroke="#1e2d4a" stroke-width="1"/>
  <text x="816" y="23" text-anchor="middle" fill="#94a3b8" font-family="Consolas,monospace" font-size="10">Clear Log</text>

  <!-- Terminal output -->
  <text x="18" y="65" fill="#a855f7" font-family="Consolas,monospace" font-size="12">System Initialized: MD. ANWAR HOSSEN  Git Dashboard  v2.0</text>
  <text x="18" y="86" fill="#d1d5db" font-family="Consolas,monospace" font-size="12">Role: Full-Stack Engineer (.NET Core &amp; MERN Stack)</text>
  <text x="18" y="107" fill="#fbbf24" font-family="Consolas,monospace" font-size="12" font-weight="bold">Company: Genuine Technology &amp; Research Ltd.</text>

  <!-- Separator -->
  <line x1="10" y1="120" x2="850" y2="120" stroke="#1e2d4a" stroke-width="1"/>

  <!-- Command Buttons Bar -->
  <rect x="0" y="120" width="860" height="80" rx="18" fill="#09101d"/>
  <rect x="0" y="120" width="860" height="14" fill="#09101d"/>

  <text x="18" y="145" fill="#64748b" font-family="Consolas,monospace" font-size="10" font-weight="bold">RUN:</text>

  <rect x="58" y="133" width="105" height="22" rx="6" fill="#152136" stroke="#00d2ff" stroke-width="0.8" stroke-opacity="0.5"/>
  <text x="110" y="148" text-anchor="middle" fill="#00d2ff" font-family="Consolas,monospace" font-size="11">$ dotnet info</text>

  <rect x="175" y="133" width="100" height="22" rx="6" fill="#152136" stroke="#00d2ff" stroke-width="0.8" stroke-opacity="0.5"/>
  <text x="225" y="148" text-anchor="middle" fill="#00d2ff" font-family="Consolas,monospace" font-size="11">$ mern stack</text>

  <rect x="287" y="133" width="100" height="22" rx="6" fill="#152136" stroke="#00d2ff" stroke-width="0.8" stroke-opacity="0.5"/>
  <text x="337" y="148" text-anchor="middle" fill="#00d2ff" font-family="Consolas,monospace" font-size="11">$ git status</text>

  <!-- Command Output preview -->
  <text x="18" y="175" fill="#00d2ff" font-family="Consolas,monospace" font-size="11">$  git status  →  On branch main  •  1,480+ commits in 2026  •  Commit Streak: 18 Days Active  ✅</text>

  <!-- Click hint -->
  <rect x="620" y="133" width="230" height="22" rx="6" fill="#0d1f0d" stroke="#10b981" stroke-width="1" stroke-opacity="0.6"/>
  <text x="735" y="148" text-anchor="middle" fill="#10b981" font-family="Consolas,monospace" font-size="11">🚀 Launch Interactive Dashboard ↗</text>
</svg>
