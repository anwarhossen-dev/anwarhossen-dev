<svg width="900" height="130" viewBox="0 0 900 130" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050914"/>
      <stop offset="100%" stop-color="#0a1020"/>
    </linearGradient>
  </defs>

  <!-- Terminal window -->
  <rect width="900" height="130" rx="16" fill="url(#termBg)" stroke="#00d2ff" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Titlebar -->
  <rect x="0" y="0" width="900" height="36" rx="16" fill="#0b1326"/>
  <rect x="0" y="18" width="900" height="18" fill="#0b1326"/>

  <!-- Traffic Lights -->
  <circle cx="22" cy="18" r="6" fill="#f05252" opacity="0.8"/>
  <circle cx="42" cy="18" r="6" fill="#f59e0b" opacity="0.8"/>
  <circle cx="62" cy="18" r="6" fill="#10B981" opacity="0.8"/>

  <!-- Terminal title -->
  <text x="82" y="23" fill="#00d2ff" font-family="'Courier New', monospace" font-size="12">⬛</text>
  <text x="98" y="23" fill="#94A3B8" font-family="'Courier New', monospace" font-size="12">anwar@dev-terminal:~</text>

  <!-- Clear log label -->
  <rect x="820" y="10" width="68" height="18" rx="4" fill="#152136" stroke="#1E2D4A" stroke-width="1"/>
  <text x="828" y="23" fill="#94A3B8" font-family="monospace" font-size="10">Clear Log</text>

  <!-- Terminal output lines -->
  <text x="18" y="58" fill="#A855F7" font-family="'Courier New', monospace" font-size="12">System Initialized: MD. ANWAR HOSSEN Git Dashboard v2.0</text>
  <text x="18" y="78" fill="#CBD5E1" font-family="'Courier New', monospace" font-size="12">Role: Full-Stack Engineer (.NET Core &amp; MERN Stack)</text>
  <text x="18" y="98" fill="#F59E0B" font-family="'Courier New', monospace" font-size="12" font-weight="bold">Company: Genuine Technology &amp; Research Ltd.</text>

  <!-- Command Buttons Bar -->
  <rect x="0" y="108" width="900" height="22" rx="8" fill="#09101d"/>
  <rect x="0" y="108" width="900" height="14" fill="#09101d"/>
  <text x="12" y="123" fill="#64748b" font-family="monospace" font-size="10" font-weight="bold">RUN:</text>
  <rect x="50" y="111" width="90" height="16" rx="4" fill="#152136" stroke="#00d2ff" stroke-width="0.8" stroke-opacity="0.4"/>
  <text x="57" y="123" fill="#00d2ff" font-family="monospace" font-size="10">$ dotnet info</text>
  <rect x="150" y="111" width="85" height="16" rx="4" fill="#152136" stroke="#00d2ff" stroke-width="0.8" stroke-opacity="0.4"/>
  <text x="157" y="123" fill="#00d2ff" font-family="monospace" font-size="10">$ mern stack</text>
  <rect x="245" y="111" width="80" height="16" rx="4" fill="#152136" stroke="#00d2ff" stroke-width="0.8" stroke-opacity="0.4"/>
  <text x="252" y="123" fill="#00d2ff" font-family="monospace" font-size="10">$ git status</text>
</svg>
