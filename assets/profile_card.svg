  <text x="313" y="48" fill="#00d2ff" font-family="monospace" font-size="10">.NET &amp; MERN</text>

  <text x="130" y="72" fill="#94A3B8" font-family="monospace" font-size="12">💼 Full-Stack Developer at  </text>
  <text x="302" y="72" fill="#FFFFFF" font-family="monospace" font-size="12" font-weight="bold">Genuine Technology &amp; Research Ltd.</text>

  <text x="130" y="92" fill="#94A3B8" font-family="monospace" font-size="12">Passionate engineer specializing in high-performance enterprise web applications with</text>
  <text x="130" y="108" fill="#94A3B8" font-family="monospace" font-size="12">ASP.NET Core, C#, React, Next.js, and SQL optimizations for scalable systems.</text>

