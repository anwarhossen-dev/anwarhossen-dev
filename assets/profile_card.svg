  <!-- Avatar Box with gradient border -->
  <rect x="22" y="22" width="90" height="90" rx="16" fill="url(#avatarGrad)" />
  <rect x="24" y="24" width="86" height="86" rx="14" fill="#0B1120"/>
  <text x="67" y="65" text-anchor="middle" fill="#00d2ff" font-family="'Courier New', monospace" font-size="26" font-weight="bold">AH</text>
  <text x="67" y="82" text-anchor="middle" fill="#475569" font-family="monospace" font-size="9">ANWAR HOSSEN</text>
  <!-- Status dot -->
  <circle cx="105" cy="105" r="6" fill="#0B1120" stroke="#0B1120" stroke-width="2"/>
  <circle cx="105" cy="105" r="5" fill="#10B981"/>

