<svg width="860" height="180" viewBox="0 0 860 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0824"/>
      <stop offset="100%" stop-color="#130b2e"/>
    </linearGradient>
    <linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#7c3aed" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0d0824" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="35%" stop-color="#00d2ff"/>
      <stop offset="70%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="860" height="180" rx="18" fill="url(#bg)" stroke="#7c3aed" stroke-width="1.2" stroke-opacity="0.4"/>

  <!-- Grid -->
  <g stroke="#1e2d4a" stroke-width="0.7" opacity="0.5">
    <line x1="50" y1="40" x2="840" y2="40"/>
    <line x1="50" y1="80" x2="840" y2="80"/>
    <line x1="50" y1="120" x2="840" y2="120"/>
  </g>

  <!-- Month labels -->
  <g font-family="Consolas,monospace" font-size="10" fill="#475569">
    <text x="75"  y="155">Oct</text>
    <text x="187" y="155">Nov</text>
    <text x="299" y="155">Dec</text>
    <text x="411" y="155">Jan</text>
    <text x="523" y="155">Feb</text>
    <text x="635" y="155">Mar</text>
    <text x="747" y="155">Apr</text>
  </g>

  <!-- Title -->
  <text x="22" y="22" fill="#00d2ff" font-family="Consolas,monospace" font-size="13" font-weight="bold">📈  Commit &amp; Coding Velocity Spline  —  Continuous Growth Over 12 Months</text>

  <!-- Area fill (closed path) -->
  <path d="M 60 128 C 90 115, 140 110, 187 98 C 234 86, 270 100, 299 88 C 328 76, 368 60, 411 55 C 454 50, 490 72, 523 60 C 556 48, 596 32, 635 24 C 674 16, 714 14, 747 10 C 780 6, 820 8, 840 9 L 840 145 L 60 145 Z" fill="url(#areaFill)"/>

  <!-- Spline line -->
  <path d="M 60 128 C 90 115, 140 110, 187 98 C 234 86, 270 100, 299 88 C 328 76, 368 60, 411 55 C 454 50, 490 72, 523 60 C 556 48, 596 32, 635 24 C 674 16, 714 14, 747 10 C 780 6, 820 8, 840 9" fill="none" stroke="url(#lineGrad)" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Data points -->
  <circle cx="187" cy="98"  r="5.5" fill="#a855f7" stroke="#fff" stroke-width="1.5"/>
  <circle cx="299" cy="88"  r="5.5" fill="#00d2ff" stroke="#fff" stroke-width="1.5"/>
  <circle cx="411" cy="55"  r="5.5" fill="#10b981" stroke="#fff" stroke-width="1.5"/>
  <circle cx="523" cy="60"  r="5.5" fill="#00d2ff" stroke="#fff" stroke-width="1.5"/>
  <circle cx="635" cy="24"  r="6"   fill="#10b981" stroke="#fff" stroke-width="2"/>
  <circle cx="747" cy="10"  r="7"   fill="#f59e0b" stroke="#fff" stroke-width="2" filter="url(#glow)"/>

  <!-- Peak label -->
  <text x="747" y="6" text-anchor="middle" fill="#f59e0b" font-family="Consolas,monospace" font-size="11" font-weight="bold">235/Mo ⬆ PEAK</text>

  <!-- Bottom label -->
  <text x="430" y="170" text-anchor="middle" fill="#475569" font-family="Consolas,monospace" font-size="11">Coding velocity growing 18% month-over-month  ·  Git Commit Streak: 18 Days Active</text>
</svg>
