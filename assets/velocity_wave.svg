<svg width="900" height="190" viewBox="0 0 900 190" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wvBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b071e"/>
      <stop offset="100%" stop-color="#130f2e"/>
    </linearGradient>
    <linearGradient id="wvFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0b071e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wvStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="35%" stop-color="#00D2FF"/>
      <stop offset="70%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="wvGlow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="190" rx="16" fill="url(#wvBg)" stroke="#7C3AED" stroke-width="1.5"/>

  <!-- Grid Lines -->
  <g stroke="#334155" stroke-width="0.7" opacity="0.4">
    <line x1="50" y1="50" x2="870" y2="50"/>
    <line x1="50" y1="90" x2="870" y2="90"/>
    <line x1="50" y1="130" x2="870" y2="130"/>
  </g>

  <!-- Month Labels -->
  <text x="70"  y="160" text-anchor="middle" fill="#475569" font-family="monospace" font-size="10">Oct</text>
  <text x="186" y="160" text-anchor="middle" fill="#475569" font-family="monospace" font-size="10">Nov</text>
  <text x="302" y="160" text-anchor="middle" fill="#475569" font-family="monospace" font-size="10">Dec</text>
  <text x="418" y="160" text-anchor="middle" fill="#475569" font-family="monospace" font-size="10">Jan</text>
  <text x="534" y="160" text-anchor="middle" fill="#475569" font-family="monospace" font-size="10">Feb</text>
  <text x="650" y="160" text-anchor="middle" fill="#475569" font-family="monospace" font-size="10">Mar</text>
  <text x="766" y="160" text-anchor="middle" fill="#475569" font-family="monospace" font-size="10">Apr</text>

  <!-- Title -->
  <text x="30" y="25" fill="#00D2FF" font-family="monospace" font-size="13" font-weight="bold">📈 Commit &amp; Coding Velocity Spline — Continuous Growth Over 12 Months</text>

  <!-- Area Fill -->
  <path d="M 50 135 C 90 120, 140 115, 186 100 S 260 75, 302 85 S 370 55, 418 60 S 490 80, 534 65 S 610 38, 650 30 S 720 22, 766 18 S 840 20, 870 22 L 870 165 L 50 165 Z" fill="url(#wvFill)"/>

  <!-- Spline Stroke -->
  <path d="M 50 135 C 90 120, 140 115, 186 100 S 260 75, 302 85 S 370 55, 418 60 S 490 80, 534 65 S 610 38, 650 30 S 720 22, 766 18 S 840 20, 870 22" fill="none" stroke="url(#wvStroke)" stroke-width="3.5" stroke-linecap="round" filter="url(#wvGlow)"/>

  <!-- Data Points -->
  <circle cx="186" cy="100" r="5" fill="#A855F7" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="302" cy="85"  r="5" fill="#00D2FF" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="418" cy="60"  r="5" fill="#10B981" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="534" cy="65"  r="5" fill="#00D2FF" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="650" cy="30"  r="6" fill="#10B981" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="766" cy="18"  r="7" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2" filter="url(#wvGlow)"/>

  <!-- Peak Label -->
  <text x="766" y="12" text-anchor="middle" fill="#F59E0B" font-family="monospace" font-size="11" font-weight="bold">235/Mo ⬆ PEAK</text>

  <!-- Bottom text -->
  <text x="450" y="180" text-anchor="middle" fill="#475569" font-family="monospace" font-size="11">Coding velocity growing 18% month-over-month · Git Commit Streak: 18 Days Active</text>
</svg>
