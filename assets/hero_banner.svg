<svg width="860" height="270" viewBox="0 0 860 270" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0824"/>
      <stop offset="100%" stop-color="#130b2e"/>
    </linearGradient>
    <linearGradient id="nameColor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>
    <radialGradient id="gp" cx="0.2" cy="0.2" r="0.5">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gc" cx="0.8" cy="0.8" r="0.5">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00d2ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- bg -->
  <rect width="860" height="270" rx="22" fill="url(#bg)"/>
  <rect width="860" height="270" rx="22" fill="url(#gp)"/>
  <rect width="860" height="270" rx="22" fill="url(#gc)"/>
  <rect width="860" height="270" rx="22" stroke="#7c3aed" stroke-width="1.5" stroke-opacity="0.5" fill="none"/>

  <!-- top border glow -->
  <rect x="100" y="0" width="660" height="2" rx="1" fill="url(#nameColor)" opacity="0.7"/>

  <!-- Badge pill -->
  <rect x="285" y="24" width="290" height="28" rx="14" fill="#3b1f6b" stroke="#7c3aed" stroke-width="1" stroke-opacity="0.7"/>
  <text x="430" y="42" text-anchor="middle" fill="#c084fc" font-family="Consolas,monospace" font-size="12" font-weight="bold" letter-spacing="1.5">✦  FULL-STACK ENGINEERING PORTFOLIO</text>

  <!-- Main name - single line, properly sized -->
  <text x="430" y="120" text-anchor="middle" font-family="Arial Black,Impact,sans-serif" font-size="52" font-weight="900" letter-spacing="2">
    <tspan fill="#ffffff">MD. ANWAR </tspan><tspan fill="url(#nameColor)" filter="url(#glow)">HOSSEN</tspan>
  </text>

  <!-- Subtitle -->
  <text x="430" y="158" text-anchor="middle" fill="#e9d5ff" font-family="Consolas,monospace" font-size="15" letter-spacing="0.5">Full-Stack Software Engineer  (.NET Ecosystem &amp; MERN Stack)</text>

  <!-- Company line -->
  <text x="430" y="183" text-anchor="middle" font-family="Consolas,monospace" font-size="13">
    <tspan fill="#94a3b8">Full-Stack Developer at  </tspan>
    <tspan fill="#00d2ff" font-weight="bold">Genuine Technology &amp; Research Ltd.</tspan>
  </text>

  <!-- Bio box -->
  <rect x="80" y="204" width="700" height="50" rx="14" fill="#070414" fill-opacity="0.8" stroke="#7c3aed" stroke-width="1" stroke-opacity="0.4"/>
  <text x="430" y="225" text-anchor="middle" fill="#d1d5db" font-family="Georgia,serif" font-size="12" font-style="italic">"I am a highly motivated Full-Stack Developer specializing in enterprise ERP applications,</text>
  <text x="430" y="244" text-anchor="middle" fill="#d1d5db" font-family="Georgia,serif" font-size="12" font-style="italic">RESTful APIs, and modern React / Next.js web applications — &lt; 2 Years Experience."</text>
</svg>
