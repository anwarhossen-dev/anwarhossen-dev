<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg">
  <title>MD. Anwar Hossen - Full-Stack Software Engineer</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050914"/>
      <stop offset="50%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#060b18"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#00d2ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="glow1" cx="75%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00d2ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="30%" cy="80%" r="35%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="260" rx="24" fill="url(#bg)"/>
  <rect width="900" height="260" rx="24" fill="url(#glow1)"/>
  <rect width="900" height="260" rx="24" fill="url(#glow2)"/>

  <!-- Top gradient border line -->
  <rect x="0" y="0" width="900" height="2" rx="1" fill="url(#borderGrad)"/>
  <!-- Bottom gradient border line -->
  <rect x="0" y="258" width="900" height="2" rx="1" fill="url(#borderGrad)"/>
  <!-- Side borders -->
  <rect x="0" y="0" width="2" height="260" fill="#00d2ff" opacity="0.3"/>
  <rect x="898" y="0" width="2" height="260" fill="#A855F7" opacity="0.3"/>

  <!-- Subtle grid -->
  <g stroke="#1E2D4A" stroke-width="0.5" opacity="0.5">
    <line x1="0" y1="86" x2="900" y2="86"/>
    <line x1="0" y1="172" x2="900" y2="172"/>
    <line x1="300" y1="0" x2="300" y2="260"/>
    <line x1="600" y1="0" x2="600" y2="260"/>
  </g>

  <!-- Corner brackets -->
  <g fill="none" stroke="#00d2ff" stroke-width="2" opacity="0.6">
    <polyline points="18,10 8,10 8,28"/>
    <polyline points="882,10 892,10 892,28"/>
    <polyline points="18,250 8,250 8,232"/>
    <polyline points="882,250 892,250 892,232"/>
  </g>

  <!-- Live status pill -->
  <rect x="28" y="22" width="11" height="11" rx="5.5" fill="#10B981"/>
  <text x="44" y="31" fill="#10B981" font-family="'Courier New', monospace" font-size="10" font-weight="bold">ONLINE · AVAILABLE FOR HIRE · CYBER-DEVELOPER COMMAND DASHBOARD</text>

  <!-- Wave accent bottom -->
  <path d="M 0 210 Q 225 190, 450 210 T 900 200 L 900 260 L 0 260 Z" fill="#00d2ff" fill-opacity="0.04"/>

  <!-- Main Name -->
  <text x="58" y="105" fill="url(#nameGrad)" font-family="'Courier New', monospace" font-size="50" font-weight="bold" letter-spacing="3" filter="url(#glow)">MD. ANWAR HOSSEN</text>

  <!-- Title Line -->
  <text x="60" y="138" fill="#E2E8F0" font-family="'Courier New', monospace" font-size="16" letter-spacing="0.5">Full-Stack Software Engineer  •  Enterprise .NET Architect  •  MERN Stack Specialist</text>

  <!-- Company -->
  <text x="60" y="163" fill="#94A3B8" font-family="'Courier New', monospace" font-size="13">at  </text>
  <text x="85" y="163" fill="#00d2ff" font-family="'Courier New', monospace" font-size="13" font-weight="bold">Genuine Technology &amp; Research Ltd.</text>
  <text x="425" y="163" fill="#94A3B8" font-family="'Courier New', monospace" font-size="13">  •  Bangladesh 🇧🇩  •  &lt; 2 Years Experience</text>

  <!-- Metric Pills Row -->
  <!-- Pill 1: Ping -->
  <rect x="60" y="182" width="105" height="28" rx="8" fill="#09101d" stroke="#1E2D4A" stroke-width="1"/>
  <text x="72" y="200" fill="#94A3B8" font-family="monospace" font-size="11">Ping: </text>
  <text x="106" y="200" fill="#10B981" font-family="monospace" font-size="11" font-weight="bold">12ms ●</text>

  <!-- Pill 2: 0 APIs -->
  <rect x="175" y="182" width="130" height="28" rx="8" fill="#09101d" stroke="#1E2D4A" stroke-width="1"/>
  <text x="187" y="200" fill="#00d2ff" font-family="monospace" font-size="11">✓ Zero 3rd-Party APIs</text>

  <!-- Pill 3: Stack -->
  <rect x="315" y="182" width="170" height="28" rx="8" fill="#09101d" stroke="#1E2D4A" stroke-width="1"/>
  <text x="327" y="200" fill="#A855F7" font-family="monospace" font-size="11">⚙ ASP.NET Core + React</text>

  <!-- Pill 4: Streak -->
  <rect x="495" y="182" width="140" height="28" rx="8" fill="#09101d" stroke="#1E2D4A" stroke-width="1"/>
  <text x="507" y="200" fill="#F59E0B" font-family="monospace" font-size="11">🔥 18 Day Streak</text>
</svg>
