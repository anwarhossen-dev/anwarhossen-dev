<svg width="900" height="280" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0824"/>
      <stop offset="50%" stop-color="#130b2e"/>
      <stop offset="100%" stop-color="#070414"/>
    </linearGradient>
    <linearGradient id="hName" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="45%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>
    <radialGradient id="glowPurple" cx="20%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#9333EA" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#9333EA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="80%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00D2FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="280" rx="24" fill="url(#hBg)"/>
  <rect width="900" height="280" rx="24" fill="url(#glowPurple)"/>
  <rect width="900" height="280" rx="24" fill="url(#glowCyan)"/>
  <rect width="900" height="280" rx="24" stroke="#7C3AED" stroke-width="1.5" stroke-opacity="0.5" fill="none"/>

  <!-- Badge pill -->
  <rect x="340" y="22" width="220" height="26" rx="13" fill="#3b1f6b" stroke="#7C3AED" stroke-width="1" stroke-opacity="0.6"/>
  <text x="450" y="39" text-anchor="middle" fill="#c084fc" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="1">✦ Full-Stack Engineering Portfolio</text>

  <!-- Main Name -->
  <text x="450" y="115" text-anchor="middle" fill="#FFFFFF" font-family="'Arial Black', monospace" font-size="58" font-weight="900" letter-spacing="2">MD. ANWAR </text>
  <text x="665" y="115" fill="url(#hName)" font-family="'Arial Black', monospace" font-size="58" font-weight="900" letter-spacing="2" filter="url(#softGlow)">HOSSEN</text>

  <!-- Fix: split the name text properly -->
  <text x="450" y="110" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="0">reset</text>

  <!-- Subtitle -->
  <text x="450" y="155" text-anchor="middle" fill="#e9d5ff" font-family="'Courier New', monospace" font-size="16">Full-Stack Software Engineer (.NET Ecosystem &amp; MERN Stack)</text>
  <text x="450" y="178" text-anchor="middle" fill="#00D2FF" font-family="'Courier New', monospace" font-size="13" font-weight="bold">Full-Stack Developer at  Genuine Technology &amp; Research Ltd.</text>

  <!-- Bio Box -->
  <rect x="80" y="200" width="740" height="62" rx="16" fill="#070414" fill-opacity="0.75" stroke="#7C3AED" stroke-width="1" stroke-opacity="0.4"/>
  <text x="450" y="226" text-anchor="middle" fill="#D1D5DB" font-family="sans-serif" font-size="13" font-style="italic">"I am a highly motivated Full-Stack Developer specializing in building enterprise ERP applications,</text>
  <text x="450" y="248" text-anchor="middle" fill="#D1D5DB" font-family="sans-serif" font-size="13" font-style="italic">RESTful APIs, and modern React / Next.js web applications  (&lt; 2 Years Experience)."</text>
</svg>
