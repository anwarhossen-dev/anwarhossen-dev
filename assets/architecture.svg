<svg width="860" height="180" viewBox="0 0 860 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0824"/>
      <stop offset="100%" stop-color="#0a071a"/>
    </linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#00d2ff" opacity="0.8"/>
    </marker>
  </defs>

  <rect width="860" height="180" rx="18" fill="url(#bg)" stroke="#7c3aed" stroke-width="1.2" stroke-opacity="0.4"/>

  <!-- Title -->
  <text x="430" y="22" text-anchor="middle" fill="#00d2ff" font-family="Consolas,monospace" font-size="13" font-weight="bold">🏗️  Enterprise 4-Tier Full-Stack Architecture  —  High-Concurrency Design</text>

  <!-- Box 1: Presentation -->
  <rect x="10" y="40" width="188" height="100" rx="14" fill="#130b2e" stroke="#a855f7" stroke-width="2"/>
  <text x="104" y="72" text-anchor="middle" fill="#a855f7" font-family="Consolas,monospace" font-size="13" font-weight="bold">🖥 Presentation</text>
  <text x="104" y="92" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11">React.js / Next.js 14</text>
  <text x="104" y="110" text-anchor="middle" fill="#64748b" font-family="Consolas,monospace" font-size="10">Tailwind CSS · SPA</text>
  <rect x="18" y="130" width="172" height="4" rx="2" fill="#a855f7" opacity="0.4"/>

  <!-- Arrow 1 -->
  <line x1="200" y1="90" x2="224" y2="90" stroke="#00d2ff" stroke-width="2" marker-end="url(#arr)" opacity="0.8"/>
  <text x="212" y="82" text-anchor="middle" fill="#475569" font-family="Consolas,monospace" font-size="9">HTTPS</text>

  <!-- Box 2: API -->
  <rect x="225" y="40" width="188" height="100" rx="14" fill="#0d0824" stroke="#00d2ff" stroke-width="2"/>
  <text x="319" y="72" text-anchor="middle" fill="#00d2ff" font-family="Consolas,monospace" font-size="13" font-weight="bold">🔌 API Layer</text>
  <text x="319" y="92" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11">ASP.NET Core 8</text>
  <text x="319" y="110" text-anchor="middle" fill="#64748b" font-family="Consolas,monospace" font-size="10">REST · JWT · Swagger</text>
  <rect x="233" y="130" width="172" height="4" rx="2" fill="#00d2ff" opacity="0.4"/>

  <!-- Arrow 2 -->
  <line x1="415" y1="90" x2="439" y2="90" stroke="#00d2ff" stroke-width="2" marker-end="url(#arr)" opacity="0.8"/>
  <text x="427" y="82" text-anchor="middle" fill="#475569" font-family="Consolas,monospace" font-size="9">DI/CQRS</text>

  <!-- Box 3: Business -->
  <rect x="440" y="40" width="188" height="100" rx="14" fill="#060e0a" stroke="#10b981" stroke-width="2"/>
  <text x="534" y="72" text-anchor="middle" fill="#10b981" font-family="Consolas,monospace" font-size="13" font-weight="bold">⚙ Business Logic</text>
  <text x="534" y="92" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11">Clean Architecture</text>
  <text x="534" y="110" text-anchor="middle" fill="#64748b" font-family="Consolas,monospace" font-size="10">EF Core · Repository</text>
  <rect x="448" y="130" width="172" height="4" rx="2" fill="#10b981" opacity="0.4"/>

  <!-- Arrow 3 -->
  <line x1="630" y1="90" x2="654" y2="90" stroke="#00d2ff" stroke-width="2" marker-end="url(#arr)" opacity="0.8"/>
  <text x="642" y="82" text-anchor="middle" fill="#475569" font-family="Consolas,monospace" font-size="9">ORM/ADO</text>

  <!-- Box 4: Data -->
  <rect x="655" y="40" width="196" height="100" rx="14" fill="#100a02" stroke="#f59e0b" stroke-width="2"/>
  <text x="753" y="72" text-anchor="middle" fill="#f59e0b" font-family="Consolas,monospace" font-size="13" font-weight="bold">🗄 Data Layer</text>
  <text x="753" y="92" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11">MS SQL · MongoDB</text>
  <text x="753" y="110" text-anchor="middle" fill="#64748b" font-family="Consolas,monospace" font-size="10">Indexing · Sharding</text>
  <rect x="663" y="130" width="180" height="4" rx="2" fill="#f59e0b" opacity="0.4"/>

  <!-- Footer -->
  <text x="430" y="166" text-anchor="middle" fill="#475569" font-family="Consolas,monospace" font-size="11">Engineered for High-Concurrency  ·  Zero-Lag Response  ·  Genuine Technology &amp; Research Ltd.</text>
</svg>
