<svg width="860" height="220" viewBox="0 0 860 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0824"/>
      <stop offset="100%" stop-color="#0a071a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="860" height="220" rx="18" fill="url(#bg)" stroke="#7c3aed" stroke-width="1.2" stroke-opacity="0.4"/>

  <!-- Title -->
  <text x="430" y="24" text-anchor="middle" fill="#00d2ff" font-family="Consolas,monospace" font-size="13" font-weight="bold">⚡  Real-Time System Performance Metrics  —  Production Benchmarks</text>

  <!-- Gauge 1: API Latency cx=108 cy=115 r=60 -->
  <!-- Track -->
  <circle cx="108" cy="120" r="62" fill="none" stroke="#1e293b" stroke-width="13"/>
  <!-- Arc 90% -->
  <circle cx="108" cy="120" r="62" fill="none" stroke="#10b981" stroke-width="13"
          stroke-dasharray="350 40" stroke-dashoffset="88" transform="rotate(-180 108 120)" filter="url(#glow)"/>
  <circle cx="108" cy="120" r="44" fill="#050914" stroke="#1e293b" stroke-width="1"/>
  <text x="108" y="114" text-anchor="middle" fill="#10b981" font-family="Consolas,monospace" font-size="15" font-weight="bold">&lt; 28ms</text>
  <text x="108" y="130" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="10">API Latency</text>
  <text x="108" y="144" text-anchor="middle" fill="#10b981" font-family="Consolas,monospace" font-size="9" font-weight="bold">ULTRA FAST</text>
  <text x="108" y="198" text-anchor="middle" fill="#64748b" font-family="Consolas,monospace" font-size="10">ASP.NET Core Response</text>

  <!-- Gauge 2: SQL Efficiency cx=323 -->
  <circle cx="323" cy="120" r="62" fill="none" stroke="#1e293b" stroke-width="13"/>
  <circle cx="323" cy="120" r="62" fill="none" stroke="#00d2ff" stroke-width="13"
          stroke-dasharray="367 23" stroke-dashoffset="88" transform="rotate(-180 323 120)" filter="url(#glow)"/>
  <circle cx="323" cy="120" r="44" fill="#050914" stroke="#1e293b" stroke-width="1"/>
  <text x="323" y="114" text-anchor="middle" fill="#00d2ff" font-family="Consolas,monospace" font-size="15" font-weight="bold">99.4%</text>
  <text x="323" y="130" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="10">SQL Efficiency</text>
  <text x="323" y="144" text-anchor="middle" fill="#00d2ff" font-family="Consolas,monospace" font-size="9" font-weight="bold">OPTIMIZED</text>
  <text x="323" y="198" text-anchor="middle" fill="#64748b" font-family="Consolas,monospace" font-size="10">Query Optimization Score</text>

  <!-- Gauge 3: Code Quality cx=538 -->
  <circle cx="538" cy="120" r="62" fill="none" stroke="#1e293b" stroke-width="13"/>
  <circle cx="538" cy="120" r="62" fill="none" stroke="#a855f7" stroke-width="13"
          stroke-dasharray="363 27" stroke-dashoffset="88" transform="rotate(-180 538 120)" filter="url(#glow)"/>
  <circle cx="538" cy="120" r="44" fill="#050914" stroke="#1e293b" stroke-width="1"/>
  <text x="538" y="114" text-anchor="middle" fill="#a855f7" font-family="Consolas,monospace" font-size="15" font-weight="bold">98/100</text>
  <text x="538" y="130" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="10">Code Quality</text>
  <text x="538" y="144" text-anchor="middle" fill="#a855f7" font-family="Consolas,monospace" font-size="9" font-weight="bold">SOLID ARCH</text>
  <text x="538" y="198" text-anchor="middle" fill="#64748b" font-family="Consolas,monospace" font-size="10">Clean Architecture Score</text>

  <!-- Gauge 4: Uptime cx=753 -->
  <circle cx="753" cy="120" r="62" fill="none" stroke="#1e293b" stroke-width="13"/>
  <circle cx="753" cy="120" r="62" fill="none" stroke="#f59e0b" stroke-width="13"
          stroke-dasharray="390 0" stroke-dashoffset="88" transform="rotate(-180 753 120)" filter="url(#glow)"/>
  <circle cx="753" cy="120" r="44" fill="#050914" stroke="#1e293b" stroke-width="1"/>
  <text x="753" y="114" text-anchor="middle" fill="#f59e0b" font-family="Consolas,monospace" font-size="14" font-weight="bold">99.99%</text>
  <text x="753" y="130" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="10">System Uptime</text>
  <text x="753" y="144" text-anchor="middle" fill="#f59e0b" font-family="Consolas,monospace" font-size="9" font-weight="bold">ENTERPRISE</text>
  <text x="753" y="198" text-anchor="middle" fill="#64748b" font-family="Consolas,monospace" font-size="10">Production Availability</text>
</svg>
