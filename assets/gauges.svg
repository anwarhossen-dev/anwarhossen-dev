<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b071e"/>
      <stop offset="100%" stop-color="#130f2e"/>
    </linearGradient>
    <filter id="gaugeGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="200" rx="16" fill="url(#gBg)" stroke="#7C3AED" stroke-width="1.5"/>

  <!-- Title -->
  <text x="450" y="25" text-anchor="middle" fill="#00D2FF" font-family="monospace" font-size="13" font-weight="bold">⚡ Real-Time System Performance Metrics — Production Benchmarks</text>

  <!-- Gauge 1: API Latency -->
  <g transform="translate(113, 110)">
    <!-- Track -->
    <circle r="58" fill="none" stroke="#1e293b" stroke-width="12"/>
    <!-- Green arc 90% filled -->
    <circle r="58" fill="none" stroke="#10B981" stroke-width="12" stroke-dasharray="327 37" stroke-dashoffset="91" transform="rotate(-180)" filter="url(#gaugeGlow)"/>
    <!-- Inner Circle -->
    <circle r="40" fill="#0d0824" stroke="#1e293b" stroke-width="1"/>
    <text y="-8" text-anchor="middle" fill="#10B981" font-family="monospace" font-size="16" font-weight="bold">&lt; 28ms</text>
    <text y="12" text-anchor="middle" fill="#CBD5E1" font-family="sans-serif" font-size="10">API Latency</text>
    <text y="26" text-anchor="middle" fill="#10B981" font-family="monospace" font-size="9" font-weight="bold">ULTRA FAST</text>
  </g>
  <text x="113" y="185" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">ASP.NET Core Response</text>

  <!-- Gauge 2: SQL Efficiency -->
  <g transform="translate(338, 110)">
    <circle r="58" fill="none" stroke="#1e293b" stroke-width="12"/>
    <circle r="58" fill="none" stroke="#00D2FF" stroke-width="12" stroke-dasharray="343 21" stroke-dashoffset="91" transform="rotate(-180)" filter="url(#gaugeGlow)"/>
    <circle r="40" fill="#0d0824" stroke="#1e293b" stroke-width="1"/>
    <text y="-8" text-anchor="middle" fill="#00D2FF" font-family="monospace" font-size="16" font-weight="bold">99.4%</text>
    <text y="12" text-anchor="middle" fill="#CBD5E1" font-family="sans-serif" font-size="10">SQL Efficiency</text>
    <text y="26" text-anchor="middle" fill="#00D2FF" font-family="monospace" font-size="9" font-weight="bold">OPTIMIZED</text>
  </g>
  <text x="338" y="185" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">Query Optimization Score</text>

  <!-- Gauge 3: Code Quality -->
  <g transform="translate(563, 110)">
    <circle r="58" fill="none" stroke="#1e293b" stroke-width="12"/>
    <circle r="58" fill="none" stroke="#A855F7" stroke-width="12" stroke-dasharray="340 24" stroke-dashoffset="91" transform="rotate(-180)" filter="url(#gaugeGlow)"/>
    <circle r="40" fill="#0d0824" stroke="#1e293b" stroke-width="1"/>
    <text y="-8" text-anchor="middle" fill="#A855F7" font-family="monospace" font-size="16" font-weight="bold">98 / 100</text>
    <text y="12" text-anchor="middle" fill="#CBD5E1" font-family="sans-serif" font-size="10">Code Quality</text>
    <text y="26" text-anchor="middle" fill="#A855F7" font-family="monospace" font-size="9" font-weight="bold">SOLID ARCH</text>
  </g>
  <text x="563" y="185" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">Clean Architecture Score</text>

  <!-- Gauge 4: Uptime -->
  <g transform="translate(788, 110)">
    <circle r="58" fill="none" stroke="#1e293b" stroke-width="12"/>
    <circle r="58" fill="none" stroke="#F59E0B" stroke-width="12" stroke-dasharray="363 1" stroke-dashoffset="91" transform="rotate(-180)" filter="url(#gaugeGlow)"/>
    <circle r="40" fill="#0d0824" stroke="#1e293b" stroke-width="1"/>
    <text y="-8" text-anchor="middle" fill="#F59E0B" font-family="monospace" font-size="16" font-weight="bold">99.99%</text>
    <text y="12" text-anchor="middle" fill="#CBD5E1" font-family="sans-serif" font-size="10">System Uptime</text>
    <text y="26" text-anchor="middle" fill="#F59E0B" font-family="monospace" font-size="9" font-weight="bold">ENTERPRISE</text>
  </g>
  <text x="788" y="185" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">Production Availability</text>
</svg>
