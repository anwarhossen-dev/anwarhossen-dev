<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="weekBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b071e"/>
      <stop offset="100%" stop-color="#130f2e"/>
    </linearGradient>
    <linearGradient id="barG1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="barG2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="barG3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <rect width="900" height="200" rx="16" fill="url(#weekBg)" stroke="#7C3AED" stroke-width="1.5"/>

  <!-- Grid Lines -->
  <g stroke="#334155" stroke-width="0.8" opacity="0.5">
    <line x1="70" y1="35" x2="870" y2="35"/>
    <line x1="70" y1="72" x2="870" y2="72"/>
    <line x1="70" y1="109" x2="870" y2="109"/>
  </g>

  <!-- Y Labels -->
  <text x="55" y="39" text-anchor="end" fill="#64748b" font-family="monospace" font-size="10">9h</text>
  <text x="55" y="76" text-anchor="end" fill="#64748b" font-family="monospace" font-size="10">6h</text>
  <text x="55" y="113" text-anchor="end" fill="#64748b" font-family="monospace" font-size="10">3h</text>

  <!-- Title -->
  <text x="30" y="22" fill="#00D2FF" font-family="monospace" font-size="13" font-weight="bold">⏱ Weekly Coding Breakdown — Total: 47.8 Hrs This Week · Avg: 6.8 Hrs/Day</text>

  <!-- Bars - Mon -->
  <rect x="85" y="65" width="70" height="79" rx="8" fill="url(#barG1)" opacity="0.9"/>
  <text x="120" y="60" text-anchor="middle" fill="#A855F7" font-family="monospace" font-size="12" font-weight="bold">6.2h</text>
  <text x="120" y="160" text-anchor="middle" fill="#CBD5E1" font-family="monospace" font-size="12">Mon</text>

  <!-- Bars - Tue -->
  <rect x="195" y="43" width="70" height="101" rx="8" fill="url(#barG2)" opacity="0.9"/>
  <text x="230" y="38" text-anchor="middle" fill="#00D2FF" font-family="monospace" font-size="12" font-weight="bold">7.8h</text>
  <text x="230" y="160" text-anchor="middle" fill="#CBD5E1" font-family="monospace" font-size="12">Tue</text>

  <!-- Bars - Wed (Peak) -->
  <rect x="305" y="29" width="70" height="115" rx="8" fill="url(#barG3)"/>
  <text x="340" y="24" text-anchor="middle" fill="#10B981" font-family="monospace" font-size="12" font-weight="bold">8.4h ⬆</text>
  <text x="340" y="160" text-anchor="middle" fill="#10B981" font-family="monospace" font-size="12" font-weight="bold">Wed</text>

  <!-- Bars - Thu -->
  <rect x="415" y="52" width="70" height="92" rx="8" fill="url(#barG1)" opacity="0.85"/>
  <text x="450" y="47" text-anchor="middle" fill="#A855F7" font-family="monospace" font-size="12" font-weight="bold">7.1h</text>
  <text x="450" y="160" text-anchor="middle" fill="#CBD5E1" font-family="monospace" font-size="12">Thu</text>

  <!-- Bars - Fri -->
  <rect x="525" y="36" width="70" height="108" rx="8" fill="url(#barG2)" opacity="0.9"/>
  <text x="560" y="31" text-anchor="middle" fill="#00D2FF" font-family="monospace" font-size="12" font-weight="bold">8.0h</text>
  <text x="560" y="160" text-anchor="middle" fill="#CBD5E1" font-family="monospace" font-size="12">Fri</text>

  <!-- Bars - Sat -->
  <rect x="635" y="79" width="70" height="65" rx="8" fill="url(#barG1)" opacity="0.6"/>
  <text x="670" y="74" text-anchor="middle" fill="#A855F7" font-family="monospace" font-size="12" font-weight="bold">5.5h</text>
  <text x="670" y="160" text-anchor="middle" fill="#CBD5E1" font-family="monospace" font-size="12">Sat</text>

  <!-- Bars - Sun -->
  <rect x="745" y="92" width="70" height="52" rx="8" fill="url(#barG1)" opacity="0.5"/>
  <text x="780" y="87" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="12" font-weight="bold">4.8h</text>
  <text x="780" y="160" text-anchor="middle" fill="#CBD5E1" font-family="monospace" font-size="12">Sun</text>

  <!-- Avg Line -->
  <line x1="70" y1="88" x2="870" y2="88" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.7"/>
  <text x="875" y="92" fill="#F59E0B" font-family="monospace" font-size="10" font-weight="bold">AVG</text>

  <!-- Bottom Label -->
  <text x="450" y="182" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="11">WakaTime Sync Active · VS Code + Visual Studio 2022 · ASP.NET Core &amp; React Projects</text>
</svg>
